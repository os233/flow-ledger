# 每日刷新 GitHub 项目卡片缓存数据并提交（计划书 P0：项目卡片每日由 Actions 刷新）
name: Refresh GitHub data

on:
  schedule:
    - cron: '23 2 * * *' # 每天 UTC 02:23
  workflow_dispatch:

permissions:
  contents: write # 提交刷新后的缓存文件
  actions: write  # 缓存更新后触发 Deploy 工作流

concurrency:
  group: refresh-github-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Fetch GitHub repo data
        env:
          GITHUB_TOKEN: ${{ github.token }} # 仅提升匿名限额，密钥不落盘、不进产物
        run: node scripts/fetch-github-data.mjs

      - name: Commit refreshed cache
        id: commit
        run: |
          if git diff --quiet src/data/github-cache.json; then
            echo "缓存无变化，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/github-cache.json
            git commit -m "chore: refresh GitHub project data cache"
            # 期间若有内容提交落在 main，先变基再推送，避免覆盖或推送失败
            git fetch origin main
            git rebase origin/main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 触发的 push 不会启动其他工作流（GitHub 官方限制），
      # 缓存更新后必须显式 workflow_dispatch，否则刷新的数据永远不会部署上线
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
