<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Relative Image Post</title>
  <meta property="article:tag" content="图片">
</head>
<body>
  <article>
    <h1>Relative Image Post</h1>
    <p>下面的图片使用相对路径，导入时应复制到 public/media/ 并改写链接：</p>
    <img src="./imgs/pic.png" alt="相对路径图片">
    <p>这张不存在，应记入迁移报告：</p>
    <img src="./imgs/missing.png" alt="不存在的图片">
    <p>这张是外链，应保留：</p>
    <img src="https://example.com/remote.png" alt="外链图片">
  </article>
</body>
</html>
